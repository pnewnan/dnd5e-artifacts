<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wild Shape Reference — Aelenthor</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700&family=Cinzel:wght@400;600;700&family=IM+Fell+English:ital@0;1&display=swap" rel="stylesheet">
<style>
  :root {
    --parchment: #f2e8c9; --parchment-shadow: #b89d5e; --ink: #1a1108; --dim: #2e200e; --faded: #5a4a2e;
    --blood: #7a1f1f; --purple: #5b2d8e; --gold: #8a6a10; --teal: #1e5f5f;
    --spore: #4a3a6e; --spore-light: rgba(74,58,110,0.08);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #06100a;
    background-image: radial-gradient(ellipse at 15% 0%, #0a1e10 0%, transparent 55%), radial-gradient(ellipse at 85% 100%, #0e0a18 0%, transparent 55%);
    font-family: 'IM Fell English', serif; color: var(--ink); padding: 1.5rem 1rem 3rem; min-height: 100vh;
  }
  .page { max-width: 1150px; margin: 0 auto; background-color: var(--parchment); border: 2px solid var(--parchment-shadow); box-shadow: 0 0 0 6px #06100a, 0 0 0 8px var(--parchment-shadow), 0 20px 60px rgba(0,0,0,0.85); overflow: hidden; }
  .page-inner { padding: 2.5rem 2.5rem 3rem; }

  /* ── TITLE ── */
  .page-title { text-align: center; border-bottom: 2px solid var(--parchment-shadow); padding-bottom: 1.1rem; margin-bottom: 1.5rem; }
  .player-label { font-family: 'Cinzel', serif; font-size: 0.65rem; letter-spacing: 0.35em; color: var(--spore); text-transform: uppercase; display: block; margin-bottom: 0.3rem; }
  .page-title h1 { font-family: 'Cinzel Decorative', cursive; font-size: clamp(1.4rem, 3.5vw, 2.2rem); color: var(--ink); line-height: 1.2; }
  .page-title .subtitle { font-style: italic; color: var(--faded); font-size: 0.92rem; margin-top: 0.4rem; line-height: 1.55; }
  .back-link { display: inline-block; font-family: 'Cinzel', serif; font-size: 0.62rem; letter-spacing: 0.2em; text-transform: uppercase; color: var(--faded); text-decoration: none; margin-top: 0.5rem; transition: color 0.2s; }
  .back-link:hover { color: var(--spore); }

  /* ── INTRO ── */
  .intro { margin-bottom: 1.4rem; }
  .intro p { font-size: 0.88rem; line-height: 1.7; color: var(--dim); margin-bottom: 0.5rem; }
  .intro p:last-child { margin-bottom: 0; }

  /* ── STAT RULE ── */
  .stat-rule { margin-bottom: 1.8rem; border: 1px solid var(--parchment-shadow); background: rgba(180,140,60,0.05); padding: 1rem 1.2rem; }
  .stat-rule h3 { font-family: 'Cinzel', serif; font-size: 0.68rem; letter-spacing: 0.2em; text-transform: uppercase; color: var(--spore); margin-bottom: 0.6rem; }
  .stat-rule-cols { display: grid; grid-template-columns: 1fr 1fr; gap: 1.2rem; }
  @media (max-width: 640px) { .stat-rule-cols { grid-template-columns: 1fr; } }
  .stat-rule p.lead { font-size: 0.84rem; color: var(--dim); margin-bottom: 0.35rem; font-style: italic; }
  .stat-rule ul { margin-left: 1.1rem; font-size: 0.84rem; color: var(--dim); line-height: 1.65; }
  .stat-rule .footer { margin-top: 0.8rem; font-size: 0.84rem; font-style: italic; color: var(--faded); border-top: 1px solid rgba(180,140,60,0.25); padding-top: 0.6rem; }

  /* ── FILTER BAR ── */
  .filter-bar { display: flex; flex-wrap: wrap; gap: 0.4rem; margin-bottom: 1.8rem; padding-bottom: 1rem; border-bottom: 1px solid rgba(180,140,60,0.3); align-items: center; }
  .filter-label { font-family: 'Cinzel', serif; font-size: 0.6rem; letter-spacing: 0.2em; text-transform: uppercase; color: var(--faded); margin-right: 0.2rem; }
  .filter-btn { font-family: 'Cinzel', serif; font-size: 0.58rem; letter-spacing: 0.1em; text-transform: uppercase; padding: 0.32rem 0.8rem; border: 1px solid rgba(74,58,110,0.35); background: var(--spore-light); color: var(--faded); cursor: pointer; border-radius: 2px; transition: all 0.15s; }
  .filter-btn:hover { background: rgba(74,58,110,0.15); color: var(--ink); }
  .filter-btn.active { background: var(--spore); border-color: var(--spore); color: var(--parchment); }

  /* ── SECTION ── */
  .env-section { margin-bottom: 2.4rem; }
  .env-section:last-child { margin-bottom: 0; }
  .section-head { font-family: 'Cinzel', serif; font-size: 0.7rem; letter-spacing: 0.25em; text-transform: uppercase; color: var(--spore); margin: 0 0 0.7rem; border-bottom: 1px solid rgba(74,58,110,0.25); padding-bottom: 0.3rem; }
  .section-note { font-style: italic; font-size: 0.84rem; color: var(--faded); margin-bottom: 0.8rem; padding: 0.5rem 0.8rem; border-left: 2px solid rgba(74,58,110,0.3); background: var(--spore-light); line-height: 1.6; }

  /* ── TABLE ── */
  .table-wrap { overflow-x: auto; border: 1px solid var(--parchment-shadow); background: rgba(255,252,240,0.45); }
  table.ws-table { width: 100%; border-collapse: collapse; font-size: 0.78rem; min-width: 1080px; }
  table.ws-table thead th {
    font-family: 'Cinzel', serif; font-size: 0.56rem; letter-spacing: 0.1em; text-transform: uppercase;
    color: var(--parchment); background: var(--spore); text-align: left; padding: 0.5rem 0.6rem; white-space: nowrap;
  }
  table.ws-table tbody td { padding: 0.5rem 0.6rem; border-bottom: 1px solid rgba(180,140,60,0.2); color: var(--dim); line-height: 1.5; vertical-align: top; }
  table.ws-table tbody tr:last-child td { border-bottom: none; }
  table.ws-table tbody tr:nth-child(even) { background: rgba(180,140,60,0.05); }
  table.ws-table td.ws-name { font-weight: 700; color: var(--ink); white-space: nowrap; }
  table.ws-table td.ws-cr, table.ws-table td.ws-hp, table.ws-table td.ws-ac { white-space: nowrap; text-align: center; }
  table.ws-table td.ws-speed, table.ws-table td.ws-mods { white-space: nowrap; }
  table.ws-table td.ws-where { min-width: 190px; }

  /* ── DM NOTE (shares stat-rule box styling) ── */
  .dm-note { margin-top: 2.2rem; border: 1px solid var(--parchment-shadow); background: rgba(180,140,60,0.05); padding: 1rem 1.2rem; }
  .dm-note h3 { font-family: 'Cinzel', serif; font-size: 0.68rem; letter-spacing: 0.2em; text-transform: uppercase; color: var(--blood); margin-bottom: 0.6rem; }
  .dm-note-cols { display: grid; grid-template-columns: 1fr 1fr; gap: 1.2rem; }
  @media (max-width: 640px) { .dm-note-cols { grid-template-columns: 1fr; } }
  .dm-note p.lead { font-size: 0.84rem; color: var(--dim); margin-bottom: 0.35rem; font-style: italic; }
  .dm-note ul { margin-left: 1.1rem; font-size: 0.84rem; color: var(--dim); line-height: 1.65; }
  .dm-note .footer { margin-top: 0.8rem; font-size: 0.84rem; font-style: italic; color: var(--faded); border-top: 1px solid rgba(180,140,60,0.25); padding-top: 0.6rem; }

  /* ── QUICK GUIDE ── */
  .quick-guide { margin-top: 2.4rem; }
  .quick-guide-head { font-family: 'Cinzel', serif; font-size: 0.7rem; letter-spacing: 0.25em; text-transform: uppercase; color: var(--gold); margin: 0 0 0.9rem; border-bottom: 1px solid rgba(138,106,16,0.3); padding-bottom: 0.3rem; }
  .quick-guide-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
  @media (max-width: 720px) { .quick-guide-grid { grid-template-columns: 1fr; } }
  .quick-guide-card { border: 1px solid rgba(138,106,16,0.3); background: rgba(138,106,16,0.05); }
  .quick-guide-card h4 { font-family: 'Cinzel', serif; font-size: 0.64rem; letter-spacing: 0.12em; text-transform: uppercase; color: var(--gold); padding: 0.55rem 0.8rem; border-bottom: 1px solid rgba(138,106,16,0.25); }
  table.qg-table { width: 100%; border-collapse: collapse; font-size: 0.8rem; }
  table.qg-table td { padding: 0.45rem 0.8rem; border-bottom: 1px solid rgba(138,106,16,0.15); vertical-align: top; }
  table.qg-table tr:last-child td { border-bottom: none; }
  table.qg-table td.qg-form { font-weight: 700; color: var(--ink); white-space: nowrap; width: 1%; }
  table.qg-table td.qg-why { color: var(--dim); font-style: italic; }

  .loading { text-align: center; font-style: italic; color: var(--faded); padding: 3rem 0; font-size: 0.9rem; }

  /* ── NAV BTN ── */
  #aelNavBtn { position: fixed; bottom: 1.2rem; right: 1.2rem; z-index: 1001; font-family: 'Cinzel', serif; font-size: 0.58rem; letter-spacing: 0.2em; text-transform: uppercase; background: rgba(26,18,9,0.9); border: 1px solid var(--parchment-shadow); padding: 0.45rem 0.9rem; color: rgba(242,232,200,0.7); cursor: pointer; user-select: none; transition: color 0.2s; }
  #aelNavBtn:hover { color: rgba(242,232,200,1); }

  @media (max-width: 600px) { .page-inner { padding: 1.5rem 1rem 2rem; } }
</style>
</head>
<body>

<!-- NAV PANEL -->
<div id="aelNavPanel" style="display:none;position:fixed;inset:0 0 0 auto;z-index:1000;width:min(300px,90vw);background:rgba(8,6,3,0.97);border-left:1px solid rgba(180,140,60,0.3);overflow-y:auto;padding:1.5rem 1.2rem;transform:translateX(100%);transition:transform 0.28s cubic-bezier(0.22,1,0.36,1);"></div>
<div id="aelNavBtn" onclick="aelNavOpen()">&#9776; All Pages</div>
<script>
  window.AEL_BASE = (window.location.hostname === 'pnewnan.github.io' ? '/dnd5e-artifacts' : (function(){var p=location.pathname.split('/').filter(Boolean);p.pop();return p.length?p.map(function(){return '..';}).join('/'):'.';})()) + '/';
  document.write('<scr' + 'ipt src="' + AEL_BASE + 'nav.js"><\/scr' + 'ipt>');
</script>

<div class="page">
  <div class="page-inner">
    <div class="page-title">
      <span class="player-label">Player Resource</span>
      <h1>Wild Shape Animal List by Environment</h1>
      <p class="subtitle" id="wsSubtitle">Loading…</p>
      <a class="back-link" href="index.html">← Table of Contents</a>
    </div>

    <div class="intro" id="wsIntro"></div>

    <div id="statRule"></div>

    <div id="filterBar" class="filter-bar"></div>

    <div id="wsRoot"><p class="loading">Loading…</p></div>
  </div>
</div>

<script>
const DATA_SRC = 'wildshape_reference.json';

function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"]/g, function(c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c];
  });
}

function crSortValue(cr) {
  var s = String(cr).trim();
  var isDM = /DM/i.test(s);
  var numPart = s.replace(/\s*\/\s*DM/i, '').trim();
  var val;
  if (numPart.indexOf('/') !== -1) {
    var parts = numPart.split('/');
    val = parseFloat(parts[0]) / parseFloat(parts[1]);
  } else {
    val = parseFloat(numPart) || 0;
  }
  return { val: val, isDM: isDM };
}

function sortByCrThenName(list) {
  return list.slice().sort(function(a, b) {
    var ca = crSortValue(a.cr), cb = crSortValue(b.cr);
    if (ca.val !== cb.val) return ca.val - cb.val;
    if (ca.isDM !== cb.isDM) return ca.isDM ? 1 : -1;
    return a.name.localeCompare(b.name);
  });
}

function renderTable(creatures) {
  var rows = creatures.map(function(c) {
    return '<tr>' +
      '<td class="ws-name">' + esc(c.name) + '</td>' +
      '<td class="ws-cr">' + esc(c.cr) + '</td>' +
      '<td class="ws-hp">' + esc(c.hp) + '</td>' +
      '<td class="ws-ac">' + esc(c.ac) + '</td>' +
      '<td class="ws-speed">' + esc(c.speed) + '</td>' +
      '<td class="ws-mods">' + esc(c.mods) + '</td>' +
      '<td>' + esc(c.use) + '</td>' +
      '<td>' + esc(c.attack) + '</td>' +
      '<td>' + esc(c.traits) + '</td>' +
      '<td class="ws-where">' + esc(c.whereSeen) + '</td>' +
    '</tr>';
  }).join('');
  return '<div class="table-wrap"><table class="ws-table">' +
    '<thead><tr><th>Name</th><th>CR</th><th>HP</th><th>AC</th><th>Speed</th><th>Physical Mods</th><th>Use</th><th>Attack</th><th>Senses / Skills / Traits</th><th>Where Seen</th></tr></thead>' +
    '<tbody>' + rows + '</tbody></table></div>';
}

function renderQuickGuide(quickGuide) {
  var cards = quickGuide.map(function(g) {
    var rows = g.rows.map(function(r) {
      return '<tr><td class="qg-form">' + esc(r.form) + '</td><td class="qg-why">' + esc(r.why) + '</td></tr>';
    }).join('');
    return '<div class="quick-guide-card"><h4>' + esc(g.title) + '</h4>' +
      '<table class="qg-table"><tbody>' + rows + '</tbody></table></div>';
  }).join('');
  return '<div class="quick-guide" id="quickGuideBlock">' +
    '<div class="quick-guide-head">Quick Decision Guide</div>' +
    '<div class="quick-guide-grid">' + cards + '</div>' +
  '</div>';
}

fetch(DATA_SRC).then(function(r) { return r.json(); }).then(function(data) {
  document.getElementById('wsSubtitle').textContent = data.meta.subtitle;

  document.getElementById('wsIntro').innerHTML = (data.intro || []).map(function(p) {
    return '<p>' + esc(p) + '</p>';
  }).join('');

  // Stat rule box
  if (data.statRule) {
    var sr = data.statRule;
    var useCol = '<p class="lead">' + esc(sr.lead) + '</p><ul>' + sr.useBeast.map(function(i) { return '<li>' + esc(i) + '</li>'; }).join('') + '</ul>';
    var keepCol = '<p class="lead">' + esc(sr.keepLead) + '</p><ul>' + sr.keepDruid.map(function(i) { return '<li>' + esc(i) + '</li>'; }).join('') + '</ul>';
    document.getElementById('statRule').innerHTML = '<div class="stat-rule"><h3>' + esc(sr.title) + '</h3>' +
      '<div class="stat-rule-cols"><div>' + useCol + '</div><div>' + keepCol + '</div></div>' +
      '<div class="footer">' + esc(sr.note) + '</div></div>';
  }

  var envs = data.envs;
  var creatures = data.creatures;

  // Filter bar
  var filterBar = document.getElementById('filterBar');
  var btnsHtml = '<span class="filter-label">Jump to:</span>';
  btnsHtml += '<button class="filter-btn active" data-target="all">All</button>';
  envs.forEach(function(e) {
    btnsHtml += '<button class="filter-btn" data-target="' + e.id + '">' + esc(e.label) + '</button>';
  });
  filterBar.innerHTML = btnsHtml;

  // Sections — filter the flat creature list by env tag membership
  var root = document.getElementById('wsRoot');
  root.innerHTML = envs.map(function(e) {
    var inEnv = sortByCrThenName(creatures.filter(function(c) { return c.envs.indexOf(e.id) !== -1; }));
    var note = e.note ? '<div class="section-note">' + esc(e.note) + '</div>' : '';
    return '<div class="env-section" id="section-' + e.id + '" data-section="' + e.id + '">' +
      '<div class="section-head">' + esc(e.title) + '</div>' +
      note +
      renderTable(inEnv) +
    '</div>';
  }).join('');

  // DM note
  if (data.dm_note) {
    var dm = data.dm_note;
    var may = '<p class="lead">' + esc(dm.intro) + '</p><ul>' + dm.may.map(function(i) { return '<li>' + esc(i) + '</li>'; }).join('') + '</ul>';
    var mayNot = '<p class="lead">' + esc(dm.may_not_intro) + '</p><ul>' + dm.may_not.map(function(i) { return '<li>' + esc(i) + '</li>'; }).join('') + '</ul>';
    root.innerHTML += '<div class="dm-note"><h3>' + esc(dm.title) + '</h3>' +
      '<div class="dm-note-cols"><div>' + may + '</div><div>' + mayNot + '</div></div>' +
      '<div class="footer">' + esc(dm.footer) + '</div></div>';
  }

  // Quick decision guide (cross-environment — shown only on "All")
  if (data.quickGuide) {
    root.innerHTML += renderQuickGuide(data.quickGuide);
  }

  // Filter behavior
  filterBar.querySelectorAll('.filter-btn').forEach(function(btn) {
    btn.addEventListener('click', function() {
      filterBar.querySelectorAll('.filter-btn').forEach(function(b) { b.classList.remove('active'); });
      btn.classList.add('active');
      var target = btn.dataset.target;
      root.querySelectorAll('.env-section').forEach(function(sec) {
        sec.style.display = (target === 'all' || sec.dataset.section === target) ? '' : 'none';
      });
      var dmNote = root.querySelector('.dm-note');
      if (dmNote) dmNote.style.display = (target === 'all' || target === 'grounded-birds') ? '' : 'none';
      var qg = document.getElementById('quickGuideBlock');
      if (qg) qg.style.display = (target === 'all') ? '' : 'none';
    });
  });
}).catch(function(err) {
  document.getElementById('wsRoot').innerHTML = '<p class="loading">Could not load wild shape data — ' + esc(err.message) + '</p>';
});
</script>

</body>
</html>
