<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Dunmore — District Map Editor</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #1a1209; font-family: 'Segoe UI', system-ui, sans-serif; color: #f2e8c9; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }

  /* ── TOOLBAR ── */
  #toolbar {
    background: #111;
    border-bottom: 1px solid #4a3a1a;
    padding: 0.5rem 1rem;
    display: flex;
    align-items: center;
    gap: 0.75rem;
    flex-wrap: wrap;
    flex-shrink: 0;
  }
  #toolbar h2 { font-size: 0.85rem; letter-spacing: 0.1em; color: #b89d5e; flex-shrink: 0; }
  .sep { width: 1px; background: #4a3a1a; align-self: stretch; }

  input[type=text] {
    background: #222; border: 1px solid #4a3a1a; color: #f2e8c9;
    padding: 0.3rem 0.5rem; font-size: 0.8rem; width: 130px;
  }
  input[type=color] { width: 36px; height: 28px; border: 1px solid #4a3a1a; cursor: pointer; background: none; }

  button {
    font-size: 0.75rem; padding: 0.3rem 0.7rem; cursor: pointer;
    border: 1px solid; transition: all 0.15s;
  }
  .btn-add    { background: #1e5f1e; border-color: #3a9a3a; color: #cfe; }
  .btn-add:hover { background: #2a8a2a; }
  .btn-close  { background: #5f5f1e; border-color: #9a9a2a; color: #ffe; }
  .btn-close:hover { background: #8a8a2a; }
  .btn-undo   { background: #3a1e1e; border-color: #9a3a3a; color: #fcc; }
  .btn-undo:hover { background: #5a2a2a; }
  .btn-del    { background: #5f1e1e; border-color: #cc3a3a; color: #fcc; }
  .btn-del:hover { background: #8a2a2a; }
  .btn-export { background: #1e3f5f; border-color: #3a7aaa; color: #cef; }
  .btn-export:hover { background: #2a5a8a; }
  .btn-clear-all { background: #2a1a2a; border-color: #7a3a7a; color: #fce; }

  .mode-indicator {
    font-size: 0.72rem; padding: 0.25rem 0.6rem;
    background: #2a1a08; border: 1px solid #8a6a10;
    color: #c8a840; letter-spacing: 0.05em;
  }

  /* ── MAIN LAYOUT ── */
  #main { display: flex; flex: 1; overflow: hidden; }

  /* ── SIDEBAR ── */
  #sidebar {
    width: 220px; flex-shrink: 0;
    background: #0d0a06; border-right: 1px solid #4a3a1a;
    overflow-y: auto; padding: 0.75rem;
  }
  #sidebar h3 { font-size: 0.65rem; letter-spacing: 0.2em; text-transform: uppercase; color: #b89d5e; margin-bottom: 0.5rem; }

  .district-entry {
    border: 1px solid #4a3a1a; margin-bottom: 0.5rem; padding: 0.45rem 0.6rem;
    cursor: pointer; transition: background 0.12s;
  }
  .district-entry:hover { background: rgba(180,140,60,0.08); }
  .district-entry.active { border-color: #c8a840; background: rgba(200,168,64,0.1); }
  .de-name { font-size: 0.82rem; font-weight: 600; }
  .de-info { font-size: 0.65rem; color: #7a6a4a; margin-top: 0.15rem; }
  .de-swatch { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 4px; vertical-align: middle; }
  .de-actions { display: flex; gap: 4px; margin-top: 0.35rem; }
  .de-btn { font-size: 0.6rem; padding: 0.15rem 0.4rem; border: 1px solid #4a3a1a; background: #1a1209; color: #b89d5e; cursor: pointer; }
  .de-btn:hover { background: #2a1a09; }
  .de-btn.del { border-color: #7a3a3a; color: #cc6666; }

  /* ── MAP CANVAS AREA ── */
  #canvas-wrap {
    flex: 1; overflow: auto; position: relative; background: #222;
    cursor: crosshair;
  }
  #canvas-wrap.mode-view { cursor: default; }

  #map-img {
    display: block;
    /* Size controlled by zoom */
  }

  #overlay-svg {
    position: absolute;
    top: 0; left: 0;
    pointer-events: none;
  }

  /* ── STATUS BAR ── */
  #statusbar {
    background: #0d0a06; border-top: 1px solid #4a3a1a;
    padding: 0.25rem 1rem; font-size: 0.7rem; color: #7a6a4a;
    display: flex; gap: 1.5rem; flex-shrink: 0;
  }
  #statusbar span b { color: #b89d5e; }
</style>
</head>
<body>

<!-- TOOLBAR -->
<div id="toolbar">
  <h2>⬡ District Editor</h2>
  <div class="sep"></div>

  <input type="text" id="district-name" placeholder="District name" value="New District">
  <input type="color" id="district-color" value="#7a1f1f" title="District color">
  <button class="btn-add" onclick="addDistrict()">+ New District</button>

  <div class="sep"></div>

  <button class="btn-close" onclick="closePolygon()" title="Close current polygon (or press Enter)">✓ Close Shape</button>
  <button class="btn-undo" onclick="undoPoint()" title="Remove last point (or press Backspace)">↩ Undo Point</button>

  <div class="sep"></div>

  <div class="mode-indicator" id="mode-label">Click map to add points</div>

  <div class="sep"></div>

  <label style="font-size:0.72rem;color:#b89d5e;">Zoom:
    <input type="range" id="zoom-slider" min="30" max="150" value="60" style="width:80px;vertical-align:middle" oninput="setZoom(this.value)">
    <span id="zoom-val">60%</span>
  </label>

  <div class="sep"></div>

  <button class="btn-export" onclick="exportJSON()">⬇ Export JSON</button>
  <button class="btn-clear-all" onclick="clearAll()">✕ Clear All</button>
</div>

<!-- MAIN -->
<div id="main">

  <!-- SIDEBAR -->
  <div id="sidebar">
    <h3>Districts</h3>
    <div id="district-list"></div>
  </div>

  <!-- MAP -->
  <div id="canvas-wrap" onclick="handleMapClick(event)">
    <img id="map-img" src="dunmore_map_day.png" alt="Dunmore map" onload="initMap()">
    <svg id="overlay-svg"></svg>
  </div>

</div>

<!-- STATUS -->
<div id="statusbar">
  <span>Active: <b id="active-name">—</b></span>
  <span>Points: <b id="pt-count">0</b></span>
  <span>Districts: <b id="dist-count">0</b></span>
  <span id="cursor-pos">x: — y: —</span>
  <span style="margin-left:auto;color:#4a3a1a">Click to add point · Enter/✓ to close · Backspace/↩ to undo · Click sidebar to switch district</span>
</div>

<script>
// ── State ──────────────────────────────────────────────────────────────────
let districts = [];        // [{id, name, color, points: [[x,y],...], closed}]
let activeId = null;
let mapNaturalW = 0, mapNaturalH = 0;
let zoomPct = 60;

// ── Init ───────────────────────────────────────────────────────────────────
function initMap() {
  const img = document.getElementById('map-img');
  mapNaturalW = img.naturalWidth;
  mapNaturalH = img.naturalHeight;
  setZoom(zoomPct);
  renderAll();
}

function setZoom(pct) {
  zoomPct = parseInt(pct);
  document.getElementById('zoom-val').textContent = pct + '%';
  const img = document.getElementById('map-img');
  const svg = document.getElementById('overlay-svg');
  const displayW = mapNaturalW * zoomPct / 100;
  const displayH = mapNaturalH * zoomPct / 100;
  img.style.width  = displayW + 'px';
  img.style.height = displayH + 'px';
  svg.setAttribute('width',  displayW);
  svg.setAttribute('height', displayH);
  svg.setAttribute('viewBox', `0 0 ${displayW} ${displayH}`);
  renderAll();
}

// ── District management ────────────────────────────────────────────────────
function addDistrict() {
  const name  = document.getElementById('district-name').value.trim() || 'District';
  const color = document.getElementById('district-color').value;
  const id    = Date.now();
  districts.push({ id, name, color, points: [], closed: false });
  activeId = id;
  renderSidebar();
  renderAll();
  document.getElementById('district-name').value = '';
  updateStatus();
}

function setActive(id) {
  activeId = id;
  renderSidebar();
  updateStatus();
}

function deleteDistrict(id) {
  districts = districts.filter(d => d.id !== id);
  if (activeId === id) activeId = districts.length ? districts[districts.length-1].id : null;
  renderSidebar();
  renderAll();
  updateStatus();
}

function closePolygon() {
  const d = getActive();
  if (d && d.points.length >= 3) {
    d.closed = true;
    renderAll();
    updateStatus();
  }
}

function undoPoint() {
  const d = getActive();
  if (!d) return;
  if (d.closed) { d.closed = false; }
  else if (d.points.length > 0) { d.points.pop(); }
  renderAll();
  updateStatus();
}

function clearAll() {
  if (!confirm('Clear all districts?')) return;
  districts = [];
  activeId = null;
  renderSidebar();
  renderAll();
  updateStatus();
}

function getActive() {
  return districts.find(d => d.id === activeId) || null;
}

// ── Map click ──────────────────────────────────────────────────────────────
function handleMapClick(e) {
  const d = getActive();
  if (!d || d.closed) return;

  const wrap = document.getElementById('canvas-wrap');
  const rect = wrap.getBoundingClientRect();
  const imgRect = document.getElementById('map-img').getBoundingClientRect();

  // Position relative to image
  const px = e.clientX - imgRect.left;
  const py = e.clientY - imgRect.top;

  // Convert to percentage of natural image size
  const xPct = (px / imgRect.width  * 100);
  const yPct = (py / imgRect.height * 100);

  d.points.push([parseFloat(xPct.toFixed(1)), parseFloat(yPct.toFixed(1))]);
  renderAll();
  updateStatus();
}

// Track cursor position
document.getElementById('canvas-wrap').addEventListener('mousemove', e => {
  const imgRect = document.getElementById('map-img').getBoundingClientRect();
  const xPct = ((e.clientX - imgRect.left) / imgRect.width  * 100).toFixed(1);
  const yPct = ((e.clientY - imgRect.top)  / imgRect.height * 100).toFixed(1);
  document.getElementById('cursor-pos').textContent = `x: ${xPct}% y: ${yPct}%`;
});

// Keyboard shortcuts
document.addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT') return;
  if (e.key === 'Enter')     closePolygon();
  if (e.key === 'Backspace') undoPoint();
});

// ── Rendering ──────────────────────────────────────────────────────────────
function renderAll() {
  const svg    = document.getElementById('overlay-svg');
  const dispW  = mapNaturalW * zoomPct / 100;
  const dispH  = mapNaturalH * zoomPct / 100;

  // Convert pct → display pixels
  const px = (xPct) => xPct / 100 * dispW;
  const py = (yPct) => yPct / 100 * dispH;

  svg.innerHTML = '';

  districts.forEach(d => {
    if (d.points.length === 0) return;
    const isActive = d.id === activeId;
    const hex      = d.color;

    // Filled polygon (if closed or has 3+ points)
    if (d.points.length >= 3) {
      const poly = document.createElementNS('http://www.w3.org/2000/svg', 'polygon');
      const pts  = d.points.map(p => `${px(p[0])},${py(p[1])}`).join(' ');
      poly.setAttribute('points', pts);
      poly.setAttribute('fill', hex);
      poly.setAttribute('fill-opacity', d.closed ? '0.22' : '0.12');
      poly.setAttribute('stroke', hex);
      poly.setAttribute('stroke-width', isActive ? '2.5' : '1.5');
      poly.setAttribute('stroke-opacity', '0.9');
      if (!d.closed) poly.setAttribute('stroke-dasharray', '6,3');
      svg.appendChild(poly);
    } else if (d.points.length === 2) {
      // Just a line
      const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
      line.setAttribute('x1', px(d.points[0][0])); line.setAttribute('y1', py(d.points[0][1]));
      line.setAttribute('x2', px(d.points[1][0])); line.setAttribute('y2', py(d.points[1][1]));
      line.setAttribute('stroke', hex); line.setAttribute('stroke-width', '2');
      line.setAttribute('stroke-dasharray', '6,3');
      svg.appendChild(line);
    }

    // Dots for each point
    d.points.forEach((p, i) => {
      const c = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
      c.setAttribute('cx', px(p[0]));
      c.setAttribute('cy', py(p[1]));
      c.setAttribute('r', isActive ? '5' : '3');
      c.setAttribute('fill', i === 0 ? '#fff' : hex);
      c.setAttribute('stroke', '#000');
      c.setAttribute('stroke-width', '1');
      svg.appendChild(c);
    });

    // Label
    if (d.points.length >= 1) {
      const cx = d.points.reduce((s,p) => s+p[0], 0) / d.points.length;
      const cy = d.points.reduce((s,p) => s+p[1], 0) / d.points.length;
      const txt = document.createElementNS('http://www.w3.org/2000/svg', 'text');
      txt.setAttribute('x', px(cx));
      txt.setAttribute('y', py(cy));
      txt.setAttribute('text-anchor', 'middle');
      txt.setAttribute('dominant-baseline', 'middle');
      txt.setAttribute('fill', '#fff');
      txt.setAttribute('font-size', isActive ? '13' : '10');
      txt.setAttribute('font-family', 'system-ui');
      txt.setAttribute('font-weight', '600');
      txt.setAttribute('stroke', '#000');
      txt.setAttribute('stroke-width', '3');
      txt.setAttribute('paint-order', 'stroke');
      txt.textContent = d.name;
      svg.appendChild(txt);
    }

    // Preview line from last point to cursor (for active, open polygon)
    // (handled by mousemove below)
  });
}

// Live preview line while drawing
let previewLine = null;
document.getElementById('canvas-wrap').addEventListener('mousemove', e => {
  const d = getActive();
  if (!d || d.closed || d.points.length === 0) return;
  const imgRect = document.getElementById('map-img').getBoundingClientRect();
  const dispW  = mapNaturalW * zoomPct / 100;
  const dispH  = mapNaturalH * zoomPct / 100;
  const px = (xPct) => xPct / 100 * dispW;
  const py = (yPct) => yPct / 100 * dispH;

  const mx = e.clientX - imgRect.left;
  const my = e.clientY - imgRect.top;
  const last = d.points[d.points.length - 1];

  // Remove old preview
  if (previewLine) previewLine.remove();

  const svg = document.getElementById('overlay-svg');
  previewLine = document.createElementNS('http://www.w3.org/2000/svg', 'line');
  previewLine.setAttribute('x1', px(last[0]));
  previewLine.setAttribute('y1', py(last[1]));
  previewLine.setAttribute('x2', mx);
  previewLine.setAttribute('y2', my);
  previewLine.setAttribute('stroke', d.color);
  previewLine.setAttribute('stroke-width', '1.5');
  previewLine.setAttribute('stroke-dasharray', '4,3');
  previewLine.setAttribute('opacity', '0.7');
  svg.appendChild(previewLine);
});

// ── Sidebar ────────────────────────────────────────────────────────────────
function renderSidebar() {
  const el = document.getElementById('district-list');
  if (districts.length === 0) {
    el.innerHTML = '<p style="font-size:0.72rem;color:#4a3a1a;font-style:italic">No districts yet.<br>Type a name and click "+ New District"</p>';
    return;
  }
  el.innerHTML = districts.map(d => `
    <div class="district-entry ${d.id === activeId ? 'active' : ''}" onclick="setActive(${d.id})">
      <div class="de-name">
        <span class="de-swatch" style="background:${d.color}"></span>
        ${d.name}
      </div>
      <div class="de-info">
        ${d.points.length} point${d.points.length !== 1 ? 's' : ''}
        ${d.closed ? ' · <span style="color:#6a9a6a">closed</span>' : d.points.length >= 3 ? ' · <span style="color:#9a9a3a">open</span>' : ''}
      </div>
      <div class="de-actions">
        <button class="de-btn" onclick="event.stopPropagation();renameDistrict(${d.id})">rename</button>
        <button class="de-btn" onclick="event.stopPropagation();recolorDistrict(${d.id})">color</button>
        <button class="de-btn" onclick="event.stopPropagation();reopenDistrict(${d.id})">${d.closed ? 'reopen' : 'close'}</button>
        <button class="de-btn del" onclick="event.stopPropagation();deleteDistrict(${d.id})">✕</button>
      </div>
    </div>
  `).join('');
}

function renameDistrict(id) {
  const d = districts.find(x => x.id === id);
  const n = prompt('New name:', d.name);
  if (n) { d.name = n; renderSidebar(); renderAll(); }
}
function recolorDistrict(id) {
  const d = districts.find(x => x.id === id);
  const n = prompt('New hex color (e.g. #7a1f1f):', d.color);
  if (n) { d.color = n; renderSidebar(); renderAll(); }
}
function reopenDistrict(id) {
  const d = districts.find(x => x.id === id);
  d.closed = !d.closed;
  renderSidebar(); renderAll();
}

// ── Status ─────────────────────────────────────────────────────────────────
function updateStatus() {
  const d = getActive();
  document.getElementById('active-name').textContent = d ? d.name : '—';
  document.getElementById('pt-count').textContent    = d ? d.points.length : 0;
  document.getElementById('dist-count').textContent  = districts.length;
  const mode = d && !d.closed ? 'Click map to add points · Enter to close' : 'Select a district to edit, or add a new one';
  document.getElementById('mode-label').textContent  = mode;
}

// ── Export ─────────────────────────────────────────────────────────────────
function exportJSON() {
  const closed = districts.filter(d => d.closed && d.points.length >= 3);
  if (closed.length === 0) {
    alert('No closed districts to export. Close each polygon first (✓ or Enter).');
    return;
  }

  const output = {
    _note: "Paste each district's polygon array into the matching district in dunmore_town-data.json",
    districts: closed.map(d => ({
      name: d.name,
      color_hex: d.color,
      polygon: d.points.map(p => [
        parseFloat(p[0].toFixed(1)),
        parseFloat(p[1].toFixed(1))
      ])
    }))
  };

  const json = JSON.stringify(output, null, 2);

  // Download
  const blob = new Blob([json], { type: 'application/json' });
  const url  = URL.createObjectURL(blob);
  const a    = document.createElement('a');
  a.href = url;
  a.download = 'dunmore_districts.json';
  a.click();
  URL.revokeObjectURL(url);

  // Also show in console
  console.log(json);
}
</script>
</body>
</html>
